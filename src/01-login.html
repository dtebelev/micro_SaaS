<body class="min-h-screen flex items-center justify-center p-6 overflow-x-hidden">
<!-- Ambient Background Decorations -->
<div class="fixed inset-0 pointer-events-none -z-10">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-surface-container opacity-40 blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[35%] h-[35%] rounded-full bg-primary-fixed opacity-20 blur-[100px]"></div>
</div>
<!-- Login Container -->
<main class="w-full max-w-[480px] animate-in fade-in slide-in-from-bottom-8 duration-700">
<!-- Logo Section -->
<div class="flex justify-center mb-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: &quot;FILL&quot; 1;">eco</span>
<span class="text-primary font-headline text-2xl font-bold tracking-tight">NaturoPin</span>
</div>
</div>
<!-- Auth Card -->
<div class="glass-card rounded-xl p-10 md:p-12 border border-white/50">
<header class="text-center mb-10">
<h1 class="font-headline text-3xl md:text-4xl text-on-surface mb-3 leading-tight">Добро пожаловать</h1>
<p class="text-on-surface-variant font-body text-body-lg leading-relaxed px-4">Войдите в свою учетную запись для управления контентом.</p>
</header>
<form action="#" class="space-y-6" method="POST">
<!-- Username/Email -->
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface ml-4" for="identifier">Имя пользователя или Email</label>
<div class="relative">
<input class="w-full h-14 px-6 rounded-lg input-soft bg-surface-container-lowest text-on-surface placeholder:text-outline/60" id="identifier" name="identifier" placeholder="username@email.com" required="" type="text">
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant">
<span class="material-symbols-outlined">person</span>
</div>
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<div class="flex justify-between items-center px-4">
<label class="block text-sm font-bold text-on-surface" for="password">Пароль</label>
<a class="text-sm font-bold text-primary hover:text-secondary transition-colors duration-200" href="#">Забыли пароль?</a>
</div>
<div class="relative">
<input class="w-full h-14 px-6 rounded-lg input-soft bg-surface-container-lowest text-on-surface placeholder:text-outline/60" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" id="togglePassword">visibility</span>
</button>
</div>
</div>
<!-- Remember Me Toggle -->
<div class="flex items-center gap-3 px-4 py-2">
<input class="w-5 h-5 rounded-md border-outline-variant text-primary focus:ring-primary/20" id="remember" type="checkbox">
<label class="text-sm text-on-surface-variant cursor-pointer select-none" for="remember">Запомнить меня на этом устройстве</label>
</div>
<!-- Login Action -->
<div class="pt-4">
<button class="w-full h-14 bg-secondary-fixed text-on-secondary-fixed font-bold text-lg rounded-full shadow-lg shadow-secondary-fixed/30 hover:shadow-xl hover:-translate-y-0.5 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 group" type="submit">
                        Войти
                        <span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
<!-- Social/Alternative Auth -->
<div class="mt-8 flex items-center gap-4">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="text-xs font-bold text-outline uppercase tracking-widest">Или войти через</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<div class="mt-6 flex justify-center gap-4">
<button class="w-full h-14 rounded-full border border-outline-variant hover:bg-surface-container transition-colors flex items-center justify-center gap-2 font-bold text-on-surface">

                    Google
                </button>
</div>

<!-- Footer Actions -->
<div class="mt-8 text-center space-y-4">

                У вас нет аккаунта? 
                <a class="text-primary font-bold hover:underline ml-1" href="#">Зарегистрироваться</a>
</p>
<div class="flex justify-center gap-6 pt-4">
<a class="text-xs text-outline hover:text-primary transition-colors" href="#">Политика конфиденциальности</a>
<a class="text-xs text-outline hover:text-primary transition-colors" href="#">Условия использования</a>
</div>
</div>
</main>
<!-- Interactive Layer for Input Effects -->
<script>
        // Password visibility toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleBtn.textContent = isPassword ? 'visibility_off' : 'visibility';
        });

        // Simple animation on focus
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.previousElementSibling?.querySelector('label')?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.previousElementSibling?.querySelector('label')?.classList.remove('text-primary');
            });
        });
    </script>
